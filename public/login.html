<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ameen Secretary — تسجيل الدخول</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --gold: #C9A84C;
      --gold-light: #e2c46a;
      --gold-dim: rgba(201,168,76,0.14);
      --navy: #0a0c14;
      --navy2: #0f1728;
      --navy3: #12151f;
      --navy4: #1a1e2e;
      --border: rgba(255,255,255,0.08);
      --text: #f0f1f5;
      --text2: #b4b8cc;
      --text3: #6b7190;
      --red: #e05a5a;
      --green: #3cc47c;
    }
    html, body { height: 100%; }
    body {
      font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
      background: var(--navy);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: stretch;
    }

    /* ══ LEFT BRAND PANEL ══ */
    .brand {
      flex: 0 0 440px;
      background: linear-gradient(145deg, #0d1f3c 0%, #0a0c14 50%, #12100a 100%);
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 3rem 2.5rem;
      overflow: hidden;
    }
    /* Decorative rings */
    .brand::before {
      content: '';
      position: absolute;
      width: 500px; height: 500px;
      border-radius: 50%;
      border: 1px solid rgba(201,168,76,0.1);
      top: -120px; left: -120px;
      pointer-events: none;
    }
    .brand::after {
      content: '';
      position: absolute;
      width: 340px; height: 340px;
      border-radius: 50%;
      border: 1px solid rgba(201,168,76,0.07);
      bottom: -80px; right: -80px;
      pointer-events: none;
    }
    .brand-glow {
      position: absolute;
      width: 320px; height: 320px;
      background: radial-gradient(ellipse, rgba(201,168,76,0.12) 0%, transparent 70%);
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
    }
    .brand-content { position: relative; z-index: 1; text-align: center; width: 100%; }
    .brand-logo-wrap {
      width: 256px; height: 66px;
      overflow: hidden;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; margin: 0 auto 1.5rem;
      filter: drop-shadow(0 4px 24px rgba(201,168,76,0.35));
    }
    .brand-logo-wrap img {
      width: 366px; height: auto; flex-shrink: 0;
    }
    .brand-logo { display: none; }
    .brand-name {
      font-size: 1.5rem; font-weight: 800;
      color: var(--text);
      letter-spacing: -0.02em;
      margin-bottom: 0.4rem;
    }
    .brand-name span { color: var(--gold); }
    .brand-tagline {
      font-size: 0.82rem;
      color: var(--text3);
      line-height: 1.7;
      max-width: 260px;
      margin: 0 auto 2.5rem;
    }
    .brand-feats { display: flex; flex-direction: column; gap: 0.75rem; width: 100%; }
    .feat {
      display: flex;
      align-items: center;
      gap: 0.85rem;
      background: rgba(255,255,255,0.035);
      border: 1px solid rgba(201,168,76,0.12);
      border-radius: 12px;
      padding: 0.75rem 1rem;
      text-align: start;
    }
    .feat-icon {
      width: 34px; height: 34px;
      background: var(--gold-dim);
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-size: 1rem; flex-shrink: 0;
    }
    .feat-text { font-size: 0.8rem; color: var(--text2); line-height: 1.4; }

    /* ══ RIGHT FORM PANEL ══ */
    .form-panel {
      flex: 1;
      background: var(--navy3);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.5rem;
      min-height: 100vh;
    }
    .form-box {
      width: 100%;
      max-width: 400px;
    }
    .form-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 2.5rem;
    }
    .form-title { font-size: 1.6rem; font-weight: 800; color: var(--text); line-height: 1.2; letter-spacing: -0.02em; }
    .form-sub { font-size: 0.84rem; color: var(--text3); margin-top: 5px; }
    .lang-sw { display: flex; gap: 0.3rem; }
    .lang-sw button {
      background: none; border: 1px solid var(--border);
      color: var(--text3); padding: 0.2rem 0.75rem;
      border-radius: 20px; cursor: pointer; font-size: 0.75rem;
      font-family: inherit; transition: all 0.15s;
    }
    .lang-sw button.on { border-color: var(--gold); color: var(--gold); background: var(--gold-dim); }

    /* Fields */
    .fg { margin-bottom: 1.1rem; }
    label {
      display: block; font-size: 0.77rem; font-weight: 600;
      color: var(--text3); margin-bottom: 0.4rem; letter-spacing: 0.01em;
    }
    input[type=email], input[type=password], input[type=text] {
      width: 100%; background: var(--navy4);
      border: 1px solid var(--border); color: var(--text);
      border-radius: 10px; padding: 0.78rem 1rem;
      font-size: 0.92rem; font-family: inherit;
      outline: none; transition: border-color 0.2s, box-shadow 0.2s;
      direction: ltr;
    }
    input:focus { border-color: var(--gold); box-shadow: 0 0 0 3px rgba(201,168,76,0.12); }
    input.err-field { border-color: var(--red); }
    .pw-wrap { position: relative; }
    .pw-wrap input { padding-inline-end: 2.8rem; }
    .eye {
      position: absolute; inset-inline-end: 0.85rem; top: 50%;
      transform: translateY(-50%); background: none; border: none;
      color: var(--text3); cursor: pointer; font-size: 0.95rem;
      line-height: 1; padding: 0; transition: color 0.15s;
    }
    .eye:hover { color: var(--gold); }
    .forgot-row { display: flex; justify-content: flex-end; margin-top: -0.55rem; margin-bottom: 1.1rem; }
    .forgot { font-size: 0.77rem; color: var(--gold); text-decoration: none; }
    .forgot:hover { text-decoration: underline; }

    /* Alert */
    .alert {
      border-radius: 10px; padding: 0.7rem 1rem;
      font-size: 0.82rem; margin-bottom: 1rem;
      display: none; text-align: center; line-height: 1.4;
    }
    .alert.error { background: rgba(224,90,90,0.1); border: 1px solid rgba(224,90,90,0.3); color: var(--red); display: block; }

    /* Submit */
    .submit {
      width: 100%; background: var(--gold); color: #0f1728;
      border: none; border-radius: 10px; padding: 0.9rem;
      font-size: 0.97rem; font-weight: 800; font-family: inherit;
      cursor: pointer; transition: opacity 0.2s, transform 0.1s;
      letter-spacing: 0.01em; margin-top: 0.25rem;
    }
    .submit:hover:not(:disabled) { opacity: 0.9; }
    .submit:active:not(:disabled) { transform: scale(0.99); }
    .submit:disabled { opacity: 0.4; cursor: not-allowed; }

    /* Footer */
    .divider {
      display: flex; align-items: center; gap: 0.75rem;
      margin: 1.5rem 0; color: var(--text3); font-size: 0.75rem;
    }
    .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: var(--border); }
    .foot-link { text-align: center; font-size: 0.82rem; color: var(--text3); }
    .foot-link a { color: var(--gold); text-decoration: none; font-weight: 600; }
    .foot-link a:hover { text-decoration: underline; }

    /* Mobile */
    @media (max-width: 720px) {
      body { flex-direction: column; }
      .brand { flex: none; min-height: auto; padding: 2.5rem 1.5rem 2rem; }
      .brand-feats { display: none; }
      .brand-logo { width: 72px; height: 72px; margin-bottom: 1rem; }
      .brand-name { font-size: 1.2rem; }
      .brand::before, .brand::after { display: none; }
      .form-panel { min-height: auto; padding: 2rem 1.25rem 3rem; }
    }
  </style>
</head>
<body>

<!-- ── Brand left ── -->
<aside class="brand">
  <div class="brand-glow"></div>
  <div class="brand-content">
    <a href="/landing.html" style="display:block;text-decoration:none;cursor:pointer;" onclick="window.location.href='/landing.html';return false;">
    <div class="brand-logo-wrap" style="pointer-events:none">
      <img src="/logo-dark.png" alt="Ameen Secretary"/>
    </div>

    </a>
    <p class="brand-tagline" id="brand-tag">نظام الأمانة التنفيذية الذكية — ذكاء موثوق وعوائد حقيقية</p>
    <div class="brand-feats">
      <div class="feat">
        <div class="feat-icon">📋</div>
        <div class="feat-text" id="f1">إدارة محاضر الاجتماعات بالذكاء الاصطناعي</div>
      </div>
      <div class="feat">
        <div class="feat-icon">🏛️</div>
        <div class="feat-text" id="f2">إدارة الحوكمة والمجالس</div>
      </div>
      <div class="feat">
        <div class="feat-icon">🔒</div>
        <div class="feat-text" id="f3">أمان وخصوصية على مستوى المؤسسات</div>
      </div>
    </div>
  </div>
</aside>

<!-- ── Form right ── -->
<main class="form-panel">
  <div class="form-box">
    <div class="form-top">
      <div>
        <div class="form-title" id="form-title">مرحباً بعودتك</div>
        <div class="form-sub" id="form-sub">سجّل الدخول للمتابعة</div>
      </div>
      <div class="lang-sw">
        <button id="btn-ar" onclick="setLang('ar')">عربي</button>
        <button id="btn-en" onclick="setLang('en')">English</button>
      </div>
    </div>

    <div class="alert" id="alert-box"></div>

    <form id="login-form" novalidate autocomplete="on">
      <div class="fg">
        <label for="email" id="lbl-email">البريد الإلكتروني</label>
        <input type="email" id="email" name="email" autocomplete="username email" placeholder="ahmad@example.com" dir="ltr" />
      </div>
      <div class="fg">
        <label for="password" id="lbl-pw">كلمة المرور</label>
        <div class="pw-wrap">
          <input type="password" id="password" name="password" autocomplete="current-password" placeholder="••••••••" dir="ltr" />
          <button type="button" class="eye" onclick="togglePw()">👁</button>
        </div>
      </div>
      <div class="forgot-row">
        <a href="#" class="forgot" id="forgot-link" onclick="handleForgot(event)">نسيت كلمة المرور؟</a>
      </div>
      <button type="submit" class="submit" id="submit-btn">
        <span id="btn-text">تسجيل الدخول</span>
      </button>
    </form>

    <div class="divider"><span id="div-or">أو</span></div>
    <div class="foot-link">
      <span id="signup-txt">ليس لديك حساب؟</span>
      <a href="/signup.html" id="signup-link"> إنشاء حساب جديد</a>
    </div>
  </div>
</main>

<script>
  const T = {
    ar: {
      title: 'مرحباً بعودتك', sub: 'سجّل الدخول للمتابعة',
      email: 'البريد الإلكتروني', pw: 'كلمة المرور',
      btn: 'تسجيل الدخول', loading: 'جارٍ التحقق...',
      forgot: 'نسيت كلمة المرور؟',
      divOr: 'أو', signupTxt: 'ليس لديك حساب؟', signupLink: ' إنشاء حساب جديد',
      brandTag: 'نظام الأمانة التنفيذية الذكية — ذكاء موثوق وعوائد حقيقية',
      f1: 'إدارة محاضر الاجتماعات بالذكاء الاصطناعي',
      f2: 'إدارة الحوكمة والمجالس', f3: 'أمان وخصوصية على مستوى المؤسسات',
      badCreds: 'البريد الإلكتروني أو كلمة المرور غير صحيحة',
      emptyFields: 'يرجى إدخال البريد الإلكتروني وكلمة المرور',
      networkErr: 'خطأ في الاتصال بالخادم',
      forgotMsg: 'تواصل مع مسؤول النظام لإعادة تعيين كلمة المرور.',
    },
    en: {
      title: 'Welcome back', sub: 'Sign in to continue',
      email: 'Email Address', pw: 'Password',
      btn: 'Sign In', loading: 'Signing in...',
      forgot: 'Forgot password?',
      divOr: 'or', signupTxt: "Don't have an account?", signupLink: ' Create one',
      brandTag: 'Smart Executive Secretariat — Trusted intelligence. ROI you can see.',
      f1: 'AI-powered meeting minutes',
      f2: 'Board & governance management', f3: 'Enterprise-grade security',
      badCreds: 'Invalid email or password',
      emptyFields: 'Please enter your email and password',
      networkErr: 'Could not connect to the server',
      forgotMsg: 'Please contact your system administrator to reset your password.',
    }
  };

  let lang = localStorage.getItem('lang') || 'ar';

  function setLang(l) {
    lang = l;
    localStorage.setItem('lang', l);
    document.documentElement.lang = l;
    document.documentElement.dir = l === 'ar' ? 'rtl' : 'ltr';
    document.getElementById('btn-ar').classList.toggle('on', l === 'ar');
    document.getElementById('btn-en').classList.toggle('on', l === 'en');
    const t = T[l];
    document.getElementById('form-title').textContent  = t.title;
    document.getElementById('form-sub').textContent    = t.sub;
    document.getElementById('lbl-email').textContent   = t.email;
    document.getElementById('lbl-pw').textContent      = t.pw;
    document.getElementById('btn-text').textContent    = t.btn;
    document.getElementById('forgot-link').textContent = t.forgot;
    document.getElementById('div-or').textContent      = t.divOr;
    document.getElementById('signup-txt').textContent  = t.signupTxt;
    document.getElementById('signup-link').textContent = t.signupLink;
    document.getElementById('brand-tag').textContent   = t.brandTag;
    document.getElementById('f1').textContent = t.f1;
    document.getElementById('f2').textContent = t.f2;
    document.getElementById('f3').textContent = t.f3;
  }
  setLang(lang);

  function togglePw() {
    const inp = document.getElementById('password');
    const btn = document.querySelector('.eye');
    const show = inp.type === 'password';
    inp.type = show ? 'text' : 'password';
    btn.textContent = show ? '🙈' : '👁';
  }

  function handleForgot(e) {
    e.preventDefault();
    alert(T[lang].forgotMsg);
  }

  function showAlert(msg) {
    const el = document.getElementById('alert-box');
    el.textContent = msg;
    el.className = 'alert error';
  }

  document.getElementById('login-form').addEventListener('submit', async e => {
    e.preventDefault();
    const t = T[lang];
    const email    = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    if (!email || !password) { showAlert(t.emptyFields); return; }

    const btn = document.getElementById('submit-btn');
    btn.disabled = true;
    document.getElementById('btn-text').textContent = t.loading;

    try {
      const res  = await fetch('/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        credentials: 'include',
        body: JSON.stringify({ email, password })
      });
      const data = await res.json();
      if (res.ok && data.success) {
        if (data.user?.lang_pref) localStorage.setItem('lang', data.user.lang_pref);
        if (data.token) sessionStorage.setItem('ameen_token_fb', data.token);
        window.location.replace('/');
      } else if (res.status === 403 && data.error === 'email_not_verified') {
        window.location.replace('/verify-email.html?email=' + encodeURIComponent(data.email));
      } else {
        showAlert(data.error || t.badCreds);
        btn.disabled = false;
        document.getElementById('btn-text').textContent = t.btn;
      }
    } catch {
      showAlert(t.networkErr);
      btn.disabled = false;
      document.getElementById('btn-text').textContent = t.btn;
    }
  });
</script>
</body>
</html>
