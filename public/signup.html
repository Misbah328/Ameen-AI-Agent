<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ameen Secretary — إنشاء حساب</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --gold: #C9A84C; --gold-dim: rgba(201,168,76,0.13);
      --navy: #0a0c14; --navy3: #12151f; --navy4: #1a1e2e;
      --border: rgba(255,255,255,0.08); --text: #f0f1f5; --text3: #6b7190;
      --red: #e05a5a; --green: #3cc47c;
    }
    html, body { height: 100%; }
    body {
      font-family: 'Inter','Segoe UI',system-ui,sans-serif;
      background: var(--navy);
      background-image: radial-gradient(ellipse 80% 60% at 50% 0%, rgba(201,168,76,0.07) 0%, transparent 70%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
    }

    .form-card {
      width: 100%;
      max-width: 500px;
      background: var(--navy3);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 2.5rem 2.25rem 2rem;
      box-shadow: 0 24px 80px rgba(0,0,0,0.5);
    }

    /* Logo */
    .card-top { text-align: center; margin-bottom: 1.75rem; }
    .logo-link { display: inline-flex; flex-direction: column; align-items: center; gap: 0.45rem; text-decoration: none; }
    .card-logo { width: 52px; height: 52px; object-fit: contain; filter: drop-shadow(0 4px 16px rgba(201,168,76,0.35)); }
    .card-brand { font-size: 1.1rem; font-weight: 800; color: var(--text); letter-spacing: -0.02em; }
    .card-brand span { color: var(--gold); }

    /* Top bar */
    .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; }
    .form-title { font-size: 1.3rem; font-weight: 800; color: var(--text); letter-spacing: -0.02em; }
    .lang-sw { display: flex; gap: 0.3rem; }
    .lang-sw button {
      background: none; border: 1px solid var(--border); color: var(--text3);
      padding: 0.22rem 0.75rem; border-radius: 20px; cursor: pointer;
      font-size: 0.75rem; font-family: inherit; transition: all 0.15s;
    }
    .lang-sw button.on { border-color: var(--gold); color: var(--gold); background: var(--gold-dim); }

    /* Account type toggle */
    .type-row { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; margin-bottom: 1.5rem; }
    .type-btn {
      display: flex; flex-direction: column; align-items: center; gap: 0.45rem;
      padding: 0.85rem 0.75rem; background: var(--navy4);
      border: 2px solid var(--border); border-radius: 14px; cursor: pointer;
      font-family: inherit; color: var(--text3); font-size: 0.88rem; font-weight: 700;
      transition: all 0.2s;
    }
    .type-btn:hover { border-color: rgba(201,168,76,0.3); color: #b4b8cc; }
    .type-btn.active { border-color: var(--gold); background: rgba(201,168,76,0.08); color: var(--gold); }
    .type-ic { font-size: 1.5rem; line-height: 1; }

    /* Fields */
    .fg { margin-bottom: 0.9rem; }
    .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 0.85rem; }
    .opt { font-size: 0.7rem; color: var(--text3); font-weight: 400; }
    label { display: block; font-size: 0.76rem; font-weight: 600; color: var(--text3); margin-bottom: 0.35rem; }
    input[type=email], input[type=password], input[type=text], input[type=tel] {
      width: 100%; background: var(--navy4); border: 1px solid var(--border);
      color: var(--text); border-radius: 10px; padding: 0.75rem 1rem;
      font-size: 0.92rem; font-family: inherit; outline: none;
      transition: border-color 0.2s, box-shadow 0.2s; direction: ltr;
    }
    input:focus { border-color: var(--gold); box-shadow: 0 0 0 3px rgba(201,168,76,0.12); }
    input.err { border-color: var(--red); }
    .field-err { font-size: 0.72rem; color: var(--red); margin-top: 0.28rem; display: none; }
    .pw-wrap { position: relative; }
    .pw-wrap input { padding-inline-end: 2.8rem; }
    .eye {
      position: absolute; inset-inline-end: 0.85rem; top: 50%; transform: translateY(-50%);
      background: none; border: none; color: var(--text3); cursor: pointer;
      font-size: 0.95rem; line-height: 1; padding: 0; transition: color 0.15s;
    }
    .eye:hover { color: var(--gold); }

    /* Alert */
    .alert { border-radius: 10px; padding: 0.7rem 1rem; font-size: 0.82rem; margin-bottom: 1rem; display: none; text-align: center; line-height: 1.4; }
    .alert.error   { background: rgba(224,90,90,0.1); border: 1px solid rgba(224,90,90,0.3); color: var(--red); display: block; }
    .alert.success { background: rgba(60,196,124,0.1); border: 1px solid rgba(60,196,124,0.3); color: var(--green); display: block; }

    /* Terms */
    .terms-row {
      display: flex; align-items: flex-start; gap: 0.65rem;
      margin-bottom: 1.1rem; font-size: 0.8rem; color: var(--text3); cursor: pointer;
    }
    .terms-row input[type=checkbox] { width: 16px; height: 16px; flex-shrink: 0; margin-top: 2px; accent-color: var(--gold); direction: ltr; }
    .terms-row a { color: var(--gold); text-decoration: none; }

    /* Submit button */
    .btn-submit {
      width: 100%; background: var(--gold); color: #0f1728; border: none;
      border-radius: 10px; padding: 0.95rem; font-size: 1rem; font-weight: 800;
      font-family: inherit; cursor: pointer; transition: opacity 0.2s, transform 0.1s;
      letter-spacing: 0.01em; margin-top: 0.25rem;
    }
    .btn-submit:hover { opacity: 0.9; }
    .btn-submit:active { transform: scale(0.99); }
    .btn-submit:disabled { opacity: 0.4; cursor: not-allowed; }

    /* Footer */
    .foot-link { text-align: center; font-size: 0.82rem; color: var(--text3); margin-top: 1.2rem; }
    .foot-link a { color: var(--gold); text-decoration: none; font-weight: 600; }
    .foot-link a:hover { text-decoration: underline; }

    @media (max-width: 560px) {
      body { padding: 1.25rem 0.75rem; align-items: flex-start; }
      .form-card { padding: 2rem 1.25rem 1.75rem; border-radius: 16px; }
      .field-row { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
<div class="form-card">

  <!-- Logo -->
  <div class="card-top">
    <a href="/landing.html" class="logo-link">
      <div style="width:240px;height:62px;overflow:hidden;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin:0 auto">
        <img src="/logo-dark.png" alt="Ameen Secretary" style="width:343px;height:auto;flex-shrink:0"/>
      </div>
    </a>
  </div>

  <!-- Title + lang toggle -->
  <div class="top-bar">
    <div class="form-title" id="form-title">إنشاء حساب</div>
    <div class="lang-sw">
      <button id="btn-ar" onclick="setLang('ar')">عربي</button>
      <button id="btn-en" onclick="setLang('en')">English</button>
    </div>
  </div>

  <div class="alert" id="alert-box"></div>

  <!-- Account type -->
  <div class="type-row">
    <button class="type-btn active" id="type-org" onclick="setType('org')">
      <span class="type-ic">🏢</span>
      <span id="type-org-lbl">منظمة</span>
    </button>
    <button class="type-btn" id="type-ind" onclick="setType('individual')">
      <span class="type-ic">👤</span>
      <span id="type-ind-lbl">فرد</span>
    </button>
  </div>

  <!-- Organisation name (shown for org) -->
  <div class="fg" id="org-name-wrap">
    <label id="lbl-org-name">اسم المنظمة</label>
    <input type="text" id="org-name-ar" name="organization" autocomplete="organization" placeholder="شركة الأمانة للاستشارات" />
    <div class="field-err" id="err-org-name"></div>
  </div>

  <!-- Person name -->
  <div class="fg">
    <label id="lbl-person-name">اسم المسؤول</label>
    <input type="text" id="person-name" name="name" autocomplete="name" placeholder="محمد العتيبي" />
    <div class="field-err" id="err-person-name"></div>
  </div>

  <!-- Email + Phone -->
  <div class="field-row">
    <div class="fg">
      <label id="lbl-email">البريد الإلكتروني</label>
      <input type="email" id="email" name="email" autocomplete="email" placeholder="info@company.com" dir="ltr" />
      <div class="field-err" id="err-email"></div>
    </div>
    <div class="fg">
      <label id="lbl-phone">رقم الهاتف <span class="opt">(اختياري)</span></label>
      <input type="tel" id="phone" name="tel" autocomplete="tel" placeholder="+966 5X XXX XXXX" dir="ltr" />
    </div>
  </div>

  <!-- Password -->
  <div class="fg">
    <label id="lbl-pw">كلمة المرور</label>
    <div class="pw-wrap">
      <input type="password" id="password" autocomplete="new-password" placeholder="••••••••" dir="ltr" />
      <button type="button" class="eye" onclick="togglePw(this)">👁</button>
    </div>
    <div class="field-err" id="err-pw"></div>
  </div>

  <!-- Terms -->
  <label class="terms-row">
    <input type="checkbox" id="terms-chk" />
    <span id="terms-txt">أوافق على <a href="#">شروط الاستخدام</a> وسياسة الخصوصية</span>
  </label>

  <button class="btn-submit" id="submit-btn" onclick="submitForm()">
    <span id="btn-text">إنشاء الحساب</span>
  </button>

  <div class="foot-link">
    <span id="signin-txt">لديك حساب بالفعل؟</span>
    <a href="/login.html" id="signin-link"> تسجيل الدخول</a>
  </div>
</div>

<script>
const T = {
  ar: {
    title: 'إنشاء حساب',
    typeOrg: 'منظمة', typeInd: 'فرد',
    lblOrgName: 'اسم المنظمة', lblPersonName: 'اسم المسؤول',
    lblEmail: 'البريد الإلكتروني', lblPhone: 'رقم الهاتف',
    lblPw: 'كلمة المرور',
    submit: 'إنشاء الحساب', loading: 'جارٍ إنشاء الحساب...',
    signinTxt: 'لديك حساب بالفعل؟', signinLink: ' تسجيل الدخول',
    terms: 'أوافق على <a href="#">شروط الاستخدام</a> وسياسة الخصوصية',
    orgPh: 'شركة الأمانة للاستشارات', personPh: 'محمد العتيبي',
    errOrgName: 'اسم المنظمة مطلوب',
    errPersonName: 'الاسم مطلوب',
    errEmail: 'يرجى إدخال بريد إلكتروني صحيح',
    errEmailUsed: 'هذا البريد مسجّل مسبقاً',
    errPw: 'كلمة المرور يجب أن لا تقل عن 8 أحرف',
    errTerms: 'يجب الموافقة على الشروط',
    errNetwork: 'خطأ في الاتصال بالخادم',
  },
  en: {
    title: 'Create Account',
    typeOrg: 'Organisation', typeInd: 'Individual',
    lblOrgName: 'Organisation Name', lblPersonName: 'Your Name',
    lblEmail: 'Email Address', lblPhone: 'Phone Number',
    lblPw: 'Password',
    submit: 'Create Account', loading: 'Creating account...',
    signinTxt: 'Already have an account?', signinLink: ' Sign in',
    terms: 'I agree to the <a href="#">Terms of Use</a> and Privacy Policy',
    orgPh: 'Ameen Consulting Co.', personPh: 'Ahmad Al-Otaibi',
    errOrgName: 'Organisation name is required',
    errPersonName: 'Your name is required',
    errEmail: 'Please enter a valid email address',
    errEmailUsed: 'This email is already registered',
    errPw: 'Password must be at least 8 characters',
    errTerms: 'You must agree to the terms',
    errNetwork: 'Could not connect to the server',
  }
};

let lang = localStorage.getItem('lang') || 'ar';
let accountType = 'org';
let selectedPlan = (new URLSearchParams(window.location.search)).get('plan') || 'free_trial';

function setType(type) {
  accountType = type;
  document.getElementById('type-org').classList.toggle('active', type === 'org');
  document.getElementById('type-ind').classList.toggle('active', type === 'individual');
  document.getElementById('org-name-wrap').style.display = type === 'org' ? '' : 'none';
  clearErrs();
}

function setLang(l) {
  lang = l;
  localStorage.setItem('lang', l);
  document.documentElement.lang = l;
  document.documentElement.dir = l === 'ar' ? 'rtl' : 'ltr';
  document.getElementById('btn-ar').classList.toggle('on', l === 'ar');
  document.getElementById('btn-en').classList.toggle('on', l === 'en');
  const t = T[l];
  document.getElementById('form-title').textContent     = t.title;
  document.getElementById('type-org-lbl').textContent   = t.typeOrg;
  document.getElementById('type-ind-lbl').textContent   = t.typeInd;
  document.getElementById('lbl-org-name').textContent   = t.lblOrgName;
  document.getElementById('lbl-person-name').textContent = t.lblPersonName;
  document.getElementById('lbl-email').textContent      = t.lblEmail;
  document.getElementById('lbl-phone').firstChild.textContent = t.lblPhone + ' ';
  document.getElementById('lbl-pw').textContent         = t.lblPw;
  document.getElementById('btn-text').textContent       = t.submit;
  document.getElementById('signin-txt').textContent     = t.signinTxt;
  document.getElementById('signin-link').textContent    = t.signinLink;
  document.getElementById('terms-txt').innerHTML        = t.terms;
  document.getElementById('org-name-ar').placeholder   = t.orgPh;
  document.getElementById('person-name').placeholder   = t.personPh;
  document.getElementById('person-name').dir = l === 'ar' ? 'rtl' : 'ltr';
}

function togglePw(btn) {
  const inp = document.getElementById('password');
  const show = inp.type === 'password';
  inp.type = show ? 'text' : 'password';
  btn.textContent = show ? '🙈' : '👁';
}

function showAlert(msg, type) { const el = document.getElementById('alert-box'); el.innerHTML = msg; el.className = 'alert ' + type; }
function clearAlert() { const el = document.getElementById('alert-box'); el.className = 'alert'; el.textContent = ''; }
function fieldErr(id, msg) { const el = document.getElementById(id); if (el) { el.textContent = msg; el.style.display = msg ? 'block' : 'none'; } }
function clearErrs() {
  ['err-org-name','err-person-name','err-email','err-pw'].forEach(id => fieldErr(id, ''));
  document.querySelectorAll('.err').forEach(i => i.classList.remove('err'));
}

async function submitForm() {
  clearErrs(); clearAlert();
  const t = T[lang];
  const orgName   = document.getElementById('org-name-ar').value.trim();
  const personName = document.getElementById('person-name').value.trim();
  const email      = document.getElementById('email').value.trim().toLowerCase();
  const phone      = document.getElementById('phone').value.trim();
  const pw         = document.getElementById('password').value;
  const agreed     = document.getElementById('terms-chk').checked;

  let ok = true;
  if (accountType === 'org' && !orgName) { fieldErr('err-org-name', t.errOrgName); ok = false; }
  if (!personName) { fieldErr('err-person-name', t.errPersonName); ok = false; }
  if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { fieldErr('err-email', t.errEmail); ok = false; }
  if (pw.length < 8) { fieldErr('err-pw', t.errPw); ok = false; }
  if (!agreed) { showAlert(t.errTerms, 'error'); ok = false; }
  if (!ok) return;

  const btn = document.getElementById('submit-btn');
  btn.disabled = true;
  document.getElementById('btn-text').textContent = t.loading;

  const payload = {
    accountType,
    orgNameAr: accountType === 'org' ? orgName : personName,
    orgNameEn: '',
    orgEmail:  email,
    orgPhone:  phone,
    planSlug:  selectedPlan,
    adminName: personName,
    email,
    password:  pw
  };

  try {
    const res  = await fetch('/auth/signup', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      credentials: 'include',
      body: JSON.stringify(payload)
    });
    const data = await res.json();
    if ((res.ok || res.status === 201) && data.success) {
      if (data.user?.lang_pref) localStorage.setItem('lang', data.user.lang_pref);
      if (data.token) sessionStorage.setItem('ameen_token_fb', data.token);
      showAlert(lang === 'ar' ? '✅ تم إنشاء الحساب! جارٍ التوجيه...' : '✅ Account created! Redirecting…', 'success');
      setTimeout(() => window.location.replace('/'), 1000);
    } else {
      if (data.error?.toLowerCase().includes('email')) {
        fieldErr('err-email', t.errEmailUsed);
        document.getElementById('email').classList.add('err');
      } else {
        showAlert(data.error || t.errNetwork, 'error');
      }
      btn.disabled = false;
      document.getElementById('btn-text').textContent = t.submit;
    }
  } catch {
    showAlert(T[lang].errNetwork, 'error');
    btn.disabled = false;
    document.getElementById('btn-text').textContent = t.submit;
  }
}

// Init
setLang(lang);
</script>
</body>
</html>
